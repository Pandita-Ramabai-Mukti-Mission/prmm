<!DOCTYPE html>
<!--
  MSG91 template "contact_form_submission_email" — sent to the mission
  (CONTACT_NOTIFY_EMAIL) on every Contact form submission by
  src/app/api/contact/route.ts. The {{placeholders}} must match the
  `variables` keys that route sends. Paste this into MSG91 → Email →
  Templates; this file is the source copy, not used by the site at runtime.
-->
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Form Submission</title>
</head>

<body style="Margin:0;padding:0;background-color:#f6f8fb;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#f6f8fb">
        <tr>
            <td align="center" style="padding:24px 0;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width:600px; background-color:#ffffff; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.03);">
                    <!-- Header -->
                    <tr>
                        <td align="left"
                            style="padding:24px 24px 16px 24px; background-color:#225ea8; border-radius:4px 4px 0 0;">
                            <h1
                                style="margin:0; font-size:22px; color:#ffffff; font-family:Arial,Helvetica,sans-serif;">
                                New Submission Details</h1>
                        </td>
                    </tr>
                    <!-- Main Content -->
                    <tr>
                        <td align="left" style="padding:24px 24px 8px 24px;">
                            <p
                                style="margin:0 0 16px 0; color:#1d2433; font-size:16px; font-family:Arial,Helvetica,sans-serif;">
                                A new form has been submitted. Below are the details:
                            </p>
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background:#f3f5fa; border-radius:4px;">
                                <tr>
                                    <td
                                        style="padding:10px 12px; color:#3b4252; font-size:15px; font-weight:bold; width:140px;font-family:Arial,Helvetica,sans-serif;">
                                        First Name:</td>
                                    <td
                                        style="padding:10px 12px; color:#394050; font-size:15px;font-family:Arial,Helvetica,sans-serif;">
                                        {{first_name}}</td>
                                </tr>
                                <tr>
                                    <td
                                        style="padding:10px 12px; color:#3b4252; font-size:15px; font-weight:bold;font-family:Arial,Helvetica,sans-serif;">
                                        Last Name:</td>
                                    <td
                                        style="padding:10px 12px; color:#394050; font-size:15px;font-family:Arial,Helvetica,sans-serif;">
                                        {{last_name}}</td>
                                </tr>
                                <tr>
                                    <td
                                        style="padding:10px 12px; color:#3b4252; font-size:15px; font-weight:bold;font-family:Arial,Helvetica,sans-serif;">
                                        Email:</td>
                                    <td
                                        style="padding:10px 12px; color:#394050; font-size:15px;font-family:Arial,Helvetica,sans-serif;">
                                        {{email}}</td>
                                </tr>
                                <tr>
                                    <td
                                        style="padding:10px 12px; color:#3b4252; font-size:15px; font-weight:bold;font-family:Arial,Helvetica,sans-serif;">
                                        Subject:</td>
                                    <td
                                        style="padding:10px 12px; color:#394050; font-size:15px;font-family:Arial,Helvetica,sans-serif;">
                                        {{subject}}</td>
                                </tr>
                                <tr>
                                    <td
                                        style="padding:10px 12px; color:#3b4252; font-size:15px; font-weight:bold;font-family:Arial,Helvetica,sans-serif;vertical-align:top;">
                                        Message:</td>
                                    <td
                                        style="padding:10px 12px; color:#394050; font-size:15px; font-family:Arial,Helvetica,sans-serif; white-space:pre-line;">
                                        {{message}}</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="center"
                            style="padding:24px 24px 24px 24px; background-color:#f6f8fb; border-radius:0 0 4px 4px;">
                            <p style="margin:0; color:#8b95a5; font-size:13px; font-family:Arial,Helvetica,sans-serif;">
                                This is an automated message. Please do not reply.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
