backend:
  name: github
  repo: Pandita-Ramabai-Mukti-Mission/prmm
  branch: master
  base_url: https://your-vercel-app.vercel.app # TODO: replace with your deployed site URL
  auth_endpoint: api/decap/auth

# Editorial workflow: content edits go through draft -> in review -> ready
# in the Decap UI (each backed by its own git branch + PR) instead of
# committing straight to master. See docs/dev-backlog.md #3 and
# docs/migration-plan.md, Branching strategy.
publish_mode: editorial_workflow

# When running locally with `npx decap-server`, uncomment the line below
# and run the proxy server alongside `npm run dev`.
# local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: pages
    label: Pages
    folder: content/pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: posts
    label: Posts
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: programs
    label: Programs
    folder: content/programs
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          [Boys Home, Church and Bible College, Farming, Home for Aged and Blind, Hospital, School]
      - label: Theme
        name: theme
        widget: select
        required: false
        hint: "Groups this program under one of the 'Shaping the…' narrative pages"
        options: [Mind, Spirit, Heart, Environment, Destiny]
      - { label: Photo, name: image, widget: image }
      - label: Photo Description
        name: image_alt
        widget: string
        hint: "Describe the photo in one short sentence — this is read aloud to visitors using a screen reader, and shown if the photo fails to load."
      - { label: Short Description, name: description, widget: text }
      - { label: Body, name: body, widget: markdown }
      - label: Feature on homepage
        name: featured
        widget: boolean
        default: false
        required: false
        hint: "At most one program should be featured at a time — it becomes the homepage's single-cause spotlight. Only turn this on for a cause with real, current, specific details (not a generic description)."
      - label: Donate CTA verb
        name: donate_verb
        widget: string
        required: false
        hint: "An outcome-framed donate button label for this program, e.g. \"Educate a Child\" or \"Shelter a Boy\" — shown instead of the program title on the Donate page. Leave blank to fall back to \"Support {Title}\"."

  - name: news
    label: News
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Photo, name: image, widget: image, required: false }
      - label: Photo Description
        name: image_alt
        widget: string
        required: false
        hint: "Describe the photo in one short sentence — this is read aloud to visitors using a screen reader, and shown if the photo fails to load. Required if you added a photo above."
      - { label: Body, name: body, widget: markdown }

  - name: gallery
    label: Gallery
    folder: content/gallery
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Event Date, name: date, widget: datetime }
      - label: Photos
        name: images
        widget: list
        collapsed: false
        summary: "{{fields.alt}}"
        label_singular: Photo
        hint: "Add one entry per photo. Each photo needs a short description for screen-reader visitors."
        fields:
          - { label: Photo, name: src, widget: image }
          - { label: Photo Description, name: alt, widget: string }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: reports
    label: Reports
    folder: content/reports
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Year, name: year, widget: number, value_type: int }
      - label: Type
        name: type
        widget: select
        options: [Accounts, Certificate, "Signed Accounts"]
      - { label: File, name: file, widget: file }

  - name: newsletters
    label: Newsletters
    folder: content/newsletters
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Issue Date, name: date, widget: datetime }
      - { label: File, name: file, widget: file }

  - name: contacts
    label: Regional Contacts
    folder: content/contacts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Region, name: region, widget: string }
      - { label: Contact Name, name: name, widget: string }
      - { label: Address, name: address, widget: text }
      - { label: Phone, name: phone, widget: string }
      - { label: Email, name: email, widget: string }
      - label: Use as sitewide headquarters contact
        name: is_headquarters
        widget: boolean
        default: false
        required: false
        hint: "Exactly one entry should have this on — it's what the header/footer show sitewide. Leave off for regional-only contacts."

  - name: testimonials
    label: Testimonials
    folder: content/testimonials
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Quote, name: quote, widget: text }
      - { label: Name, name: name, widget: string }
      - { label: Photo, name: image, widget: image, required: false }
      - label: Photo Description
        name: image_alt
        widget: string
        required: false
        hint: "Describe the photo in one short sentence — this is read aloud to visitors using a screen reader. Required if you added a photo above."
